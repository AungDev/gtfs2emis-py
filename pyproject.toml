[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "gtfs2emis-py"
version = "0.1.0"
description = "Estimate emissions of public transport systems based on GTFS data (Python port of the R gtfs2emis package)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "gtfs2emis-py contributors" },
]
keywords = ["gtfs", "emissions", "transport", "air-quality", "transit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

# Core runtime dependencies.
# Mapping from R package imports (DESCRIPTION) to Python equivalents:
#   gtfstools / gtfs2gps  -> gtfs-kit (GTFS I/O; interpolation built in-house, no Python gtfs2gps)
#   sf / sfheaders        -> geopandas + shapely
#   data.table            -> pandas
#   units                 -> none: canonical float64 units + boundary checks
#   terra                 -> rasterio (DEM raster I/O for slope_class_europe_emep)
#   future / furrr        -> joblib (per-shape parallelism)
dependencies = [
    # 13.0.1 is the first release of the 13 line (there is no 13.0.0) and the
    # API the reader wrapper was written against; >=10 spans four majors.
    "gtfs-kit>=13.0.1,<14",
    # Upper bound is a compatibility guard, not a preference: gtfs-kit 13.0.1
    # declares fare_attributes.transfer_duration as Int16 and pandas 3 refuses
    # to cast the values feeds actually carry (14400, 86400), so read_feed()
    # dies on the Detroit sample with
    # "TypeError: cannot safely cast non-equivalent int64 to int16".
    # Drop the bound when gtfs-kit widens the dtype.
    "pandas>=2.2.2,<3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "numpy>=1.24",
    "rasterio>=1.3",
    "joblib>=1.3",
    # Parquet EF tables and the Parquet/GeoParquet output writers.
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # tomllib is stdlib from 3.11; the pyproject-reading test needs a parser on 3.10.
    "tomli>=2.0; python_version < '3.11'",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=3.0",
]
notebooks = [
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]
# Optional fetch-time conversion: pyreadr reads the original R `.rda` files for
# CETESB/EMFAC/MOVES. The EMEP table and the existing Parquet development files
# do not need it; `load_ef_table(..., fetch=True)` tells the user to install it.
data = [
    "pyreadr>=0.5",
]

[project.urls]
Homepage = "https://github.com/AungDev/gtfs2emis-py"
Source = "https://github.com/AungDev/gtfs2emis-py"
Issues = "https://github.com/AungDev/gtfs2emis-py/issues"
# The R package this is a port of; distinct from this project's own URLs.
"Upstream R package" = "https://github.com/ipeaGIT/gtfs2emis"

[tool.hatch.build.targets.wheel]
# Includes every file under src/gtfs2emis_py, so package data (py.typed,
# data/*.parquet, data/manifest.json) ships without a separate force-include.
# A force-include of the same directory duplicates entries and makes hatchling
# refuse to build the wheel.
packages = ["src/gtfs2emis_py"]
# Only EMEP is redistributable. CETESB, EMFAC and MOVES are fetched by
# load_ef_table after an explicit fetch=True; their source files remain in the
# development tree for local tests but must not enter the wheel or sdist.
exclude = [
    "src/gtfs2emis_py/data/ef/brazil_cetesb.parquet",
    "src/gtfs2emis_py/data/ef/usa_emfac.parquet",
    "src/gtfs2emis_py/data/ef/usa_moves.parquet",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/gtfs2emis_py/data/ef/brazil_cetesb.parquet",
    "src/gtfs2emis_py/data/ef/usa_emfac.parquet",
    "src/gtfs2emis_py/data/ef/usa_moves.parquet",
    # Fetch-only originals used by data-raw; never redistribute them in an
    # sdist built from a development tree.
    "data-raw/raw",
    "data-raw/**/*.rda",
    "data-raw/**/*.parquet",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "parity: comparisons against fixtures generated by the R reference package",
    "slow: tests that take more than a few seconds (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["gtfs2emis_py"]

[tool.coverage.report]
# Floor, not a target: the suite measured 97 % on the surface when
# the gate was added. Raise it as coverage improves; lowering it is a
# deliberate commit, so a drop is visible in review.
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
]
